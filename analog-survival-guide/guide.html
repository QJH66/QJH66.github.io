.site-brand{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.site-brand a{color:inherit;text-decoration:none}
.site-nav{display:flex;gap:25px;align-items:center;overflow-x:auto;scrollbar-width:none;white-space:nowrap}

#app{min-height:70vh}
#app>main,.single-main{max-width:1220px;margin:auto;padding:0 26px 80px}
.single-home{max-width:1220px;margin:auto;padding:0 26px 80px}
.single-footer{max-width:1220px;margin:0 auto;padding:0 26px 28px;color:#81796f;font-size:12px}.single-footer-inner{border-top:1px solid var(--line);padding-top:20px}
.route-fade{animation:routeFade .18s ease both}@keyframes routeFade{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
.chapter-pager a{cursor:pointer}

/* v1.3 content polish */
.quick p{font-size:14.5px;line-height:1.68;color:#625d56}
.quick h3{margin-bottom:6px}
.exam-flow p{margin-bottom:0}
.exam-tip{line-height:1.68}

.coverage-card{margin:0 0 22px;padding:17px 19px;background:#f8f5ef;border:1px solid #e5ded3;border-radius:16px;color:#5a544c;font-size:14px;line-height:1.75}

/* v1.7 exam-priority polish */
.priority-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.priority-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid #ddd6cd;border-radius:999px;background:#fbf9f5;font-size:12px;line-height:1.2;color:#5d574f;font-weight:700}

/* v2.0 course-focus content refinement */
.mock-exam .exam-body{display:block}
.mock-exam .solution{max-width:980px;padding:25px 28px 27px}
.mock-exam .exam-head{background:#fcfaf6}
.mock-exam .label{color:#776f65}

.note-atlas{padding-top:72px}.note-atlas .section-head{margin-bottom:14px}

<header class="sitebar"><div class="sitebar-inner"><div class="site-brand"><a href="index.html#home">Analog Survival Guide</a></div><nav class="site-nav" id="siteNav" aria-label="站内导航"></nav></div></header>

<div class="note-viewer" id="noteViewer" aria-hidden="true"><div class="note-viewer-bar"><span id="noteViewerPage">原笔记</span><div><button type="button" data-note-nav="-1">‹ 上一页</button><button type="button" data-note-zoom="1">适应</button><button type="button" data-note-zoom="1.5">150%</button><button type="button" data-note-zoom="2">200%</button><button type="button" data-note-nav="1">下一页 ›</button><button class="note-viewer-close" type="button" data-close-note-viewer aria-label="关闭">×</button></div></div><div class="note-viewer-scroll"><div class="note-viewer-inner"><img id="noteViewerImg" alt=""></div></div></div><script>
(()=>{const RELEASE='20260928-14',META={diode:{code:'DIODE',name:'二极管与稳压管'},fet:{code:'FET',name:'场效应管'},bjt:{code:'BJT',name:'双极型晶体管'},frequency:{code:'FREQ',name:'频率响应'},diff:{code:'DIFF',name:'差动放大'},feedback:{code:'FEEDBACK',name:'反馈'},opamp:{code:'OP AMP',name:'运放与比较器'},power:{code:'POWER AMP',name:'功率放大'},oscillator:{code:'OSC',name:'正弦波振荡'},modulation:{code:'MOD',name:'调制'}},ORDER=Object.keys(META),app=document.getElementById('app'),nav=document.getElementById('siteNav'),lightbox=document.getElementById('globalLightbox'),lightboxImg=lightbox&&lightbox.querySelector('img'),cache=new Map();let currentPage=null,observer=null;

async function getChapter(page){if(cache.has(page))return cache.get(page);const p=fetch('chapters/'+page+'.html?v='+RELEASE,{cache:'force-cache'}).then(r=>{if(!r.ok)throw Error(page+' '+r.status);return r.text()});cache.set(page,p);try{return await p}catch(e){cache.delete(page);throw e}}

const boxes=[...app.querySelectorAll('.check-box')],key='asg-single-check-'+page;let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}boxes.forEach((b,i)=>{b.checked=!!saved[i];b.addEventListener('change',()=>{saved[i]=b.checked;try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}})});app.querySelectorAll('.check').forEach(r=>r.addEventListener('click',e=>{if(e.target.matches('input'))return;const b=r.querySelector('.check-box');if(b){b.checked=!b.checked;b.dispatchEvent(new Event('change',{bubbles:true}))}}));const ks=[...app.querySelectorAll('details.knowledge-item')];ks.forEach(x=>x.addEventListener('toggle',()=>{if(x.open)ks.forEach(y=>{if(y!==x)y.open=false})}));app.querySelectorAll('.original img').forEach(src=>src.addEventListener('click',()=>{if(lightbox&&lightboxImg){lightboxImg.src=src.src;lightboxImg.alt=src.alt||'原题大图';lightbox.classList.add('open');lightbox.setAttribute('aria-hidden','false')}}))}

let renderToken=0;async function render(){const {page,section}=route();if(!page){location.replace('index.html#home');return}setNav(page,section);try{localStorage.setItem('asg-last-route','#'+page+'/'+section)}catch(e){}document.title=META[page].code+'｜Analog Survival Guide';if(currentPage===page&&app.dataset.chapter===page){scrollSection(section,false);return}const token=++renderToken;currentPage=page;app.removeAttribute('data-chapter');loading(page);try{const h=await getChapter(page);if(token!==renderToken||currentPage!==page)return;app.innerHTML=h;app.dataset.chapter=page;app.firstElementChild&&app.firstElementChild.classList.add('route-fade');init(page);const latest=route();scrollSection(latest.page===page?latest.section:section,true);prefetch(page)}catch(e){if(token!==renderToken)return;console.error(e);app.innerHTML='<div class="chapter-error"><h2>这一章暂时没有载入成功</h2><p>可以刷新重试；旧版仍然保留作为兜底。</p><p><a href="guide-legacy.html#'+page+'/'+section+'">打开旧版章节</a></p></div>'}}
