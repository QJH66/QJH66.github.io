<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analog Survival Guide</title>
<style>
:root{--bg:#f6f5f1;--ink:#151515;--muted:#746f67;--line:#e5e0d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif}
.shell{min-height:100vh;display:grid;place-items:center;padding:24px}.box{text-align:center;max-width:520px}.title{font:800 clamp(34px,5vw,56px)/1 Inter,ui-sans-serif,-apple-system,sans-serif;letter-spacing:-.045em}
.sub{margin-top:16px;color:var(--muted);font-size:15px;line-height:1.8}.bar{width:min(300px,70vw);height:3px;background:#e7e1d8;margin:24px auto 0;border-radius:99px;overflow:hidden}
.bar:after{content:"";display:block;width:38%;height:100%;background:#6b645b;animation:go 1.1s ease-in-out infinite}@keyframes go{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
.err{display:none;margin-top:22px;padding:14px 16px;border:1px solid #dfd7cc;border-radius:14px;background:#fffdf9;color:#5b544c;font-size:14px;line-height:1.7}.err a{color:inherit;font-weight:800}
</style>
</head>
<body>
<div class="shell"><div class="box"><div class="title">Analog Survival Guide</div><div class="sub" id="status">正在载入章节内容…</div><div class="bar"></div><div class="err" id="err">章节加载失败。<a href="index.html#home">返回章节总览</a> 后重试。</div></div></div>
<script>
(() => {
const release='20260928-7';
const files=Array.from({length:10},(_,i)=>'chunks/part-'+String(i+1).padStart(2,'0')+'.txt?v='+release);
function extractConst(src,name){
  const token='const '+name+' = `';
  const st=src.indexOf(token);
  if(st<0) return '';
  const bodyStart=st+token.length;
  const en=src.indexOf('`;',bodyStart);
  return en<0?'':src.slice(bodyStart,en);
}
function injectNotes(html,page,section){
  if(!section) return html;
  const start=html.indexOf('<template id="tpl-'+page+'">');
  if(start<0) return html;
  const end=html.indexOf('</template>',start);
  const marker='<section class="section" id="knowledge">';
  const at=html.indexOf(marker,start);
  if(at<0 || at>end) return html;
  if(html.slice(start,end).includes('class="section note-atlas"')) return html;
  return html.slice(0,at)+section+html.slice(at);
}
function polish(html,loader){
  const oldQuick='<section class="grid" id="quick">';
  html=html.split(oldQuick).join('<section class="grid">');
  const oldFast='<section class="section"><div class="section-head"><h2>速通</h2>';
  html=html.split(oldFast).join('<section class="section" id="quick"><div class="section-head"><h2>速通</h2>');
  const oldNav="['home','章节'],['quick','速通'],['knowledge','知识点'],['papers','真题'],['check','考前清单']";
  const newNav="['home','章节'],['quick','速通'],['notes','核心笔记'],['knowledge','知识点'],['papers','真题'],['check','考前清单']";
  html=html.replace(oldNav,newNav);
  const map={diode:'diodeCoreNotes',fet:'fetCoreNotes',bjt:'bjtCoreNotes',frequency:'frequencyCoreNotes',diff:'diffCoreNotes',feedback:'feedbackCoreNotes',opamp:'opampCoreNotes',power:'powerCoreNotes',oscillator:'oscillatorCoreNotes',modulation:'modulationCoreNotes'};
  Object.entries(map).forEach(([page,name])=>{html=injectNotes(html,page,extractConst(loader,name));});
  html=html.split('href="#home"').join('href="index.html#home"');
  return html;
}
async function getText(url,fresh=false){
  let last;
  for(let n=0;n<3;n++){
    try{
      const r=await fetch(url,{cache:fresh?'no-store':(n===0?'force-cache':'reload')});
      if(r.ok) return await r.text();
      last=new Error(url+' '+r.status);
    }catch(e){last=e;}
    await new Promise(res=>setTimeout(res,350*(n+1)));
  }
  throw last;
}
async function boot(){
  try{
    document.getElementById('status').textContent='正在并行载入章节内容…';
    const loaderPromise=getText('index.html?v='+release,true);
    let loaded=0;
    const partPromises=files.map((file,i)=>getText(file).then(txt=>{
      loaded++;
      const el=document.getElementById('status');
      if(el) el.textContent='正在载入章节内容… '+loaded+'/10';
      return {i,txt};
    }));
    const [loader,loadedParts]=await Promise.all([loaderPromise,Promise.all(partPromises)]);
    loadedParts.sort((a,b)=>a.i-b.i);
    const html=polish(loadedParts.map(x=>x.txt).join(''),loader);
    document.open();document.write(html);document.close();
  }catch(e){
    console.error(e);
    const bar=document.querySelector('.bar');
    if(bar) bar.style.display='none';
    const status=document.getElementById('status');
    if(status) status.textContent='章节暂时没有载入成功';
    const err=document.getElementById('err');
    if(err) err.style.display='block';
  }
}
boot();
})();
</script>
</body></html>
